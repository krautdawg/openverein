# Production: Caddy (automatic HTTPS) → app → Postgres. Run it through ./ovctl; settings live in deploy/.env,
# which `ovctl install` creates (mode 600). Never commit deploy/.env.
name: ${COMPOSE_PROJECT_NAME:-openverein-prod}
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in deploy/.env}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [app]
  app:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://openverein:${POSTGRES_PASSWORD:?}@db:5432/openverein
      PUBLIC_URL: https://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      COOKIE_SECURE: "true"
      # Only Caddy on this network may set X-Forwarded-For.
      TRUST_PROXY: 172.30.57.0/24
      DATA_KEY: ${DATA_KEY:?DATA_KEY fehlt in deploy/.env}
      SMTP_URL: ${SMTP_URL:?SMTP_URL fehlt in deploy/.env}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM fehlt in deploy/.env}
    volumes: [files:/data]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: openverein
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openverein
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openverein"]
      interval: 2s
      retries: 30
networks:
  default:
    ipam: { config: [{ subnet: 172.30.57.0/24 }] }
volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
