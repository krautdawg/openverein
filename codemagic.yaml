# Codemagic workflows for the OpenVerein mobile apps (Capacitor wraps the web build).
# Debug workflows need no credentials. Release workflows read signing material and the club's
# app settings from Codemagic environment groups and integrations; see docs/mobile.md.
definitions:
  scripts:
    - &install
      name: Install and build the web app
      script: |
        npm ci
        npm run build
    - &sync
      name: Sync web build into the native projects
      script: npx cap sync

workflows:
  android-debug:
    name: Android debug (unsigned)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 24
      java: 21
      vars:
        OPENVEREIN_URL: https://demo.openverein.org # the public demo; release builds take the club's URL from the group
    scripts:
      - *install
      - *sync
      - name: Build debug APK
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-debug:
    name: iOS debug (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      xcode: latest
      vars:
        OPENVEREIN_URL: https://demo.openverein.org
    scripts:
      - *install
      - *sync
      - name: Build for the simulator without signing
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app

  android-release:
    name: Android release (signed AAB)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 24
      java: 21
      # Codemagic → Team settings → Code signing identities → Android keystores, reference name "openverein"
      android_signing:
        - openverein
      groups:
        - openverein_release # OPENVEREIN_URL, OPENVEREIN_APP_ID, OPENVEREIN_APP_NAME of the club's app
    scripts:
      - *install
      - *sync
      - name: Build signed bundle
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS release (signed IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: OpenVerein App Store Connect # Codemagic → Integrations → App Store Connect API key
    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.openverein.app # change to the club's bundle id together with the Xcode project
      groups:
        - openverein_release
    scripts:
      - *install
      - *sync
      - name: Use the Codemagic signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: agvtool new-version -all "$BUILD_NUMBER"
        working_directory: ios/App
      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
