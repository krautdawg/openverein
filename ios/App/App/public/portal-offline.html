<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12355b">
<title>Keine Verbindung</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f3f4f1; color: #14202e; }
  header { background: #12355b; color: #e9eff6; padding: 16px; font-weight: 600; }
  main { padding: 24px 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.1; margin: 0 0 12px; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border: 1px solid #858b83; border-radius: 4px; background: #fff; color: #14202e; }
</style>
</head>
<body>
<header>Mitgliederportal</header>
<main>
  <h1>Keine Verbindung</h1>
  <p>Das Portal braucht eine Internetverbindung. Sobald Du wieder online bist, geht es weiter.</p>
  <button onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
